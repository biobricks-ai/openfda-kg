name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13.5"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v6

    - name: Cache uv dependencies
      uses: actions/cache@v4
      with:
        path: |
          .venv
          .uv/cache
        key: ${{ runner.os }}-uv-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-${{ matrix.python-version }}-

    - name: Install dependencies
      run: |
        uv sync --frozen

    - name: Run tests with coverage
      run: |
        uv run pytest test/ -v --cov=stages --cov-report=xml:reports/coverage.xml --cov-report=html:reports/htmlcov --cov-report=term-missing --junitxml=reports/pytest-report.xml
      continue-on-error: true

    - name: Upload coverage to Codecov
      if: success()
      uses: codecov/codecov-action@v4
      with:
        file: ./reports/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        verbose: true

    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: |
          reports/htmlcov/
          .coverage
          reports/coverage.xml
        retention-days: 30

    - name: Upload coverage files on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-failure-${{ matrix.python-version }}
        path: |
          .coverage
          reports/coverage.xml
          reports/htmlcov/
          reports/pytest-report.xml
        retention-days: 30

  security:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v4
      with:
        python-version: "3.13"

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v6

    - name: Install dependencies
      run: |
        uv sync --frozen

    - name: Install security tools
      run: |
        uv add --dev bandit safety

    - name: Run Bandit security linter
      run: |
        uv run bandit -r stages/ -f json -o reports/bandit-report.json || true

    - name: Run Safety check
      run: |
        uv run safety check --json --output reports/safety-report.json || true

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          reports/bandit-report.json
          reports/safety-report.json
        retention-days: 30 