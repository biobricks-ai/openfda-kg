# Brick DVC stages
# See https://dvc.org/doc/user-guide/project-structure/dvcyaml-files#pipelines-files-dvcyaml

# The complete process can be executed using:
# dvc repro
# If you want to force redoing the process use 
# dvc repro -f
# Individual stage can be executed using: 
# dvc repro <stage>

stages:
  biobricks_init:
    cmd: stages/00_biobricks_init.sh
    deps:
      - stages/00_biobricks_init.sh
    always_changed: true
  process: 
    cmd: stages/01_download.sh
    deps:
      - stages/01_download.sh
    outs:
      - stages/aux/CID-Synonym-filtered
  sider:
    cmd: uv run python3 stages/02_sider.py
    deps:
      - stages/02_sider.py
      - stages/aux
    outs:
      - brick
